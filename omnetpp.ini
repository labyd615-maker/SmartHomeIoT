[General]

sim-time-limit = 30s

# Common network configuration
**.arp.typename = "GlobalArp"
**.netmaskRoutes = ""

# Common IEEE 802.15.4 radio environment
*.radioMedium.backgroundNoise.power = -110dBm


[Config Baseline]

description = "Baseline smart-home network"
network = SmartHome

# Temperature / Humidity Sensors
# ------------------------------------------------
*.temp*.numApps = 1
*.temp*.app[0].typename = "UdpBasicApp"
*.temp*.app[0].destAddresses = "gateway"
*.temp*.app[0].destPort = 1000
*.temp*.app[0].sendInterval = 10s
*.temp*.app[0].startTime = uniform(0s,1s)
*.temp*.app[0].messageLength = 50Byte
*.temp*.app[0].packetName = "TemperatureData"

# ------------------------------------------------
# Motion / Occupancy Sensors
# ------------------------------------------------
*.motion*.numApps = 1
*.motion*.app[0].typename = "UdpBasicApp"
*.motion*.app[0].destAddresses = "gateway"
*.motion*.app[0].destPort = 1000
*.motion*.app[0].sendInterval = 10s
*.motion*.app[0].startTime = uniform(0s,1s)
*.motion*.app[0].messageLength = 50Byte
*.motion*.app[0].packetName = "MotionData"

# ------------------------------------------------
# Smoke / Environmental Sensors
# ------------------------------------------------
*.smoke*.numApps = 1
*.smoke*.app[0].typename = "UdpBasicApp"
*.smoke*.app[0].destAddresses = "gateway"
*.smoke*.app[0].destPort = 1000
*.smoke*.app[0].sendInterval = 10s
*.smoke*.app[0].startTime = uniform(0s,1s)
*.smoke*.app[0].messageLength = 50Byte
*.smoke*.app[0].packetName = "SmokeData"

# ------------------------------------------------
# Gateway receives sensor readings
# ------------------------------------------------
*.gateway.numApps = 2

*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 1000

# Gateway sends control messages to actuators
*.gateway.app[1].typename = "UdpBasicApp"
*.gateway.app[1].destAddresses = "light hvac alarm"
*.gateway.app[1].destPort = 2000
*.gateway.app[1].sendInterval = 10s
*.gateway.app[1].startTime = 2s
*.gateway.app[1].messageLength = 20Byte
*.gateway.app[1].packetName = "ControlData"

# ------------------------------------------------
# Actuators receive gateway commands
# ------------------------------------------------
*.light.numApps = 1
*.light.app[0].typename = "UdpSink"
*.light.app[0].localPort = 2000

*.hvac.numApps = 1
*.hvac.app[0].typename = "UdpSink"
*.hvac.app[0].localPort = 2000

*.alarm.numApps = 1
*.alarm.app[0].typename = "UdpSink"
*.alarm.app[0].localPort = 2000


[Config Exp1]

description = "Experiment 1 - Network Scalability"
network = ScalabilityHome

# Final experiment duration
sim-time-limit = 300s

# Test five network sizes
*.numSensors = ${N=5,10,20,30,40}

# Repeat every network size with 5 random seeds
repeat = 5
seed-set = ${repetition}

# Fixed sensor positions inside a small smart-home area
*.sensor[*].mobility.typename = "StationaryMobility"
*.sensor[*].mobility.initFromDisplayString = false
*.sensor[*].mobility.initialX = 2m + (parentIndex() % 5) * 3m
*.sensor[*].mobility.initialY = 2m + floor(parentIndex() / 5) * 2m
*.sensor[*].mobility.initialZ = 0m

# Gateway position
*.gateway.mobility.typename = "StationaryMobility"
*.gateway.mobility.initFromDisplayString = false
*.gateway.mobility.initialX = 10m
*.gateway.mobility.initialY = 10m
*.gateway.mobility.initialZ = 0m

# Active sensors send periodic monitoring data
*.sensor[*].numApps = 1
*.sensor[*].app[0].typename = "UdpBasicApp"
*.sensor[*].app[0].destAddresses = "gateway"
*.sensor[*].app[0].destPort = 1000
*.sensor[*].app[0].sendInterval = 10s
*.sensor[*].app[0].startTime = uniform(0s,1s)
*.sensor[*].app[0].messageLength = 50Byte
*.sensor[*].app[0].packetName = "SensorData"

# Gateway receives sensor packets
*.gateway.numApps = 1
*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 1000

# Actuators are inactive in Experiment 1
*.light.numApps = 0
*.hvac.numApps = 0
*.alarm.numApps = 0

# IEEE 802.15.4 radio environment
*.radioMedium.backgroundNoise.power = -110dBm


[Config Exp2]

description = "Experiment 2 - Reporting Interval Trade-off"
network = ScalabilityHome

# Fixed number of active sensors
*.numSensors = 12

# Long enough to include several transmissions even for T=60s
sim-time-limit = 600s

# Reporting interval sweep
*.sensor[*].app[0].sendInterval = ${T=1s,5s,10s,30s,60s}

# Five repetitions for each interval
repeat = 5
seed-set = ${repetition}

# Disable visualizers during batch simulation
*.visualizer.osgVisualizer.typename = ""
*.visualizer.canvasVisualizer.typename = ""
# Sensor positions
*.sensor[*].mobility.typename = "StationaryMobility"
*.sensor[*].mobility.initFromDisplayString = false
*.sensor[*].mobility.initialX = 2m + (parentIndex() % 5) * 3m
*.sensor[*].mobility.initialY = 2m + floor(parentIndex() / 5) * 2m
*.sensor[*].mobility.initialZ = 0m

# Gateway position
*.gateway.mobility.typename = "StationaryMobility"
*.gateway.mobility.initFromDisplayString = false
*.gateway.mobility.initialX = 10m
*.gateway.mobility.initialY = 10m
*.gateway.mobility.initialZ = 0m

# Periodic sensor traffic
*.sensor[*].numApps = 1
*.sensor[*].app[0].typename = "UdpBasicApp"
*.sensor[*].app[0].destAddresses = "gateway"
*.sensor[*].app[0].destPort = 1000
*.sensor[*].app[0].startTime = uniform(0s,1s)
*.sensor[*].app[0].messageLength = 50Byte
*.sensor[*].app[0].packetName = "SensorData"

# Gateway receives sensor packets
*.gateway.numApps = 1
*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 1000

# Actuators inactive in Exp2
*.light.numApps = 0
*.hvac.numApps = 0
*.alarm.numApps = 0


[Config Exp3]

description = "Experiment 3 - Critical Event under Background Traffic"
network = ScalabilityHome

# 12 sensor nodes
*.numSensors = 12

# Simulation duration
sim-time-limit = 300s

# Four background traffic load levels

# Five independent repetitions
repeat = 5
seed-set = ${repetition}

# Fixed sensor positions
*.sensor[*].mobility.typename = "StationaryMobility"
*.sensor[*].mobility.initFromDisplayString = false
*.sensor[*].mobility.initialX = 2m + (parentIndex() % 5) * 3m
*.sensor[*].mobility.initialY = 2m + floor(parentIndex() / 5) * 2m
*.sensor[*].mobility.initialZ = 0m

# Gateway position
*.gateway.mobility.typename = "StationaryMobility"
*.gateway.mobility.initFromDisplayString = false
*.gateway.mobility.initialX = 10m
*.gateway.mobility.initialY = 10m
*.gateway.mobility.initialZ = 0m

# All sensors have one UDP application
*.sensor[*].numApps = 1


# ------------------------------------------------
# Critical smoke/alarm sensor = sensor[0]
# ------------------------------------------------

*.sensor[0].app[0].typename = "UdpBasicApp"
*.sensor[0].app[0].destAddresses = "gateway"
*.sensor[0].app[0].destPort = 2000

# Generate one critical alarm at 150 seconds
*.sensor[0].app[0].startTime = 150s
*.sensor[0].app[0].sendInterval = 1000s

*.sensor[0].app[0].messageLength = 50Byte
*.sensor[0].app[0].packetName = "CriticalSmokeAlarm"


# ------------------------------------------------
# Ordinary background sensors
# ------------------------------------------------

*.sensor[1..11].app[0].typename = "UdpBasicApp"
*.sensor[1..11].app[0].destAddresses = "gateway"
*.sensor[1..11].app[0].destPort = 1000
*.sensor[1..11].app[0].sendInterval = ${B=10s,5s,1s,0.5s}
*.sensor[1..11].app[0].startTime = uniform(0s,1s)
*.sensor[1..11].app[0].messageLength = 50Byte
*.sensor[1..11].app[0].packetName = "BackgroundData"


# ------------------------------------------------
# Gateway
# app[0] receives background traffic
# app[1] receives critical alarm only
# ------------------------------------------------

*.gateway.numApps = 2

*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 1000

*.gateway.app[1].typename = "UdpSink"
*.gateway.app[1].localPort = 2000


# Actuators inactive in this experiment
*.light.numApps = 0
*.hvac.numApps = 0
*.alarm.numApps = 0

# Disable visualization for Cmdenv batch runs
*.visualizer.osgVisualizer.typename = ""
*.visualizer.canvasVisualizer.typename = ""


[Config Exp4_RequestResponse]

description = "Experiment 4A - Request Response Strategy"
network = ScalabilityHome

# 12 sensors
*.numSensors = 12

# Simulation duration
sim-time-limit = 300s

# Four polling intervals
# P = 1s is high polling load, P = 30s is low polling load
*.gateway.app[*].sendInterval = ${P=1s,5s,10s,30s}

# Five repetitions
repeat = 5
seed-set = ${repetition}

# ------------------------------------------------
# Fixed positions
# ------------------------------------------------

*.sensor[*].mobility.typename = "StationaryMobility"
*.sensor[*].mobility.initFromDisplayString = false
*.sensor[*].mobility.initialX = 2m + (parentIndex() % 5) * 3m
*.sensor[*].mobility.initialY = 2m + floor(parentIndex() / 5) * 2m
*.sensor[*].mobility.initialZ = 0m

*.gateway.mobility.typename = "StationaryMobility"
*.gateway.mobility.initFromDisplayString = false
*.gateway.mobility.initialX = 10m
*.gateway.mobility.initialY = 10m
*.gateway.mobility.initialZ = 0m

# ------------------------------------------------
# Sensors act as request/response servers
# ------------------------------------------------

*.sensor[*].numApps = 1
*.sensor[*].app[0].typename = "UdpEchoApp"
*.sensor[*].app[0].localPort = 4000

# ------------------------------------------------
# Gateway polls all 12 sensors
# One polling application for each sensor
# ------------------------------------------------

*.gateway.numApps = 12

*.gateway.app[*].typename = "UdpBasicApp"
*.gateway.app[*].destPort = 4000
*.gateway.app[*].startTime = uniform(0s,0.1s)
*.gateway.app[*].messageLength = 50Byte
*.gateway.app[*].packetName = "PollRequest"

*.gateway.app[0].destAddresses = "sensor[0]"
*.gateway.app[1].destAddresses = "sensor[1]"
*.gateway.app[2].destAddresses = "sensor[2]"
*.gateway.app[3].destAddresses = "sensor[3]"
*.gateway.app[4].destAddresses = "sensor[4]"
*.gateway.app[5].destAddresses = "sensor[5]"
*.gateway.app[6].destAddresses = "sensor[6]"
*.gateway.app[7].destAddresses = "sensor[7]"
*.gateway.app[8].destAddresses = "sensor[8]"
*.gateway.app[9].destAddresses = "sensor[9]"
*.gateway.app[10].destAddresses = "sensor[10]"
*.gateway.app[11].destAddresses = "sensor[11]"

# Actuators are inactive
*.light.numApps = 0
*.hvac.numApps = 0
*.alarm.numApps = 0

# Disable visualizers during batch runs
*.visualizer.osgVisualizer.typename = ""
*.visualizer.canvasVisualizer.typename = ""


[Config Exp4_PublishSubscribe]

description = "Experiment 4B - Publish Subscribe Strategy"
network = ScalabilityHome

# 12 sensors
*.numSensors = 12

# Simulation duration
sim-time-limit = 300s

# Four publishing intervals
*.sensor[*].app[0].sendInterval = ${P=1s,5s,10s,30s}

# Five repetitions
repeat = 5
seed-set = ${repetition}

# ------------------------------------------------
# Fixed positions
# ------------------------------------------------

*.sensor[*].mobility.typename = "StationaryMobility"
*.sensor[*].mobility.initFromDisplayString = false
*.sensor[*].mobility.initialX = 2m + (parentIndex() % 5) * 3m
*.sensor[*].mobility.initialY = 2m + floor(parentIndex() / 5) * 2m
*.sensor[*].mobility.initialZ = 0m

*.gateway.mobility.typename = "StationaryMobility"
*.gateway.mobility.initFromDisplayString = false
*.gateway.mobility.initialX = 10m
*.gateway.mobility.initialY = 10m
*.gateway.mobility.initialZ = 0m

# ------------------------------------------------
# Sensors publish directly to gateway/broker
# ------------------------------------------------

*.sensor[*].numApps = 1
*.sensor[*].app[0].typename = "UdpBasicApp"
*.sensor[*].app[0].destAddresses = "gateway"
*.sensor[*].app[0].destPort = 5000
*.sensor[*].app[0].startTime = uniform(0s,0.1s)
*.sensor[*].app[0].messageLength = 50Byte
*.sensor[*].app[0].packetName = "PublishData"

# ------------------------------------------------
# Gateway acts as broker/receiver
# ------------------------------------------------

*.gateway.numApps = 1
*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 5000

# Actuators inactive
*.light.numApps = 0
*.hvac.numApps = 0
*.alarm.numApps = 0

# Disable visualization for batch runs
*.visualizer.osgVisualizer.typename = ""
*.visualizer.canvasVisualizer.typename = ""